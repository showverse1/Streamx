<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Studio Background -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#180b1e" />
      <stop offset="60%" stop-color="#0a050d" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Vibrant Cinema Stream Gradient -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Subtle Golden Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <!-- Glowing Rim Filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Glass Border -->
  <rect width="490" height="490" x="11" y="11" rx="104" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.12" />
  <rect width="478" height="478" x="17" y="17" rx="98" fill="none" stroke="url(#streamGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Central Cinema Play & Stream Emblem -->
  <g filter="url(#iconShadow)">
    <!-- Iconic Cinema Play Triangle with Rounded Corners -->
    <path d="M 195 145 C 195 132 209 124 220 131 L 380 238 C 390 245 390 267 380 274 L 220 381 C 209 388 195 380 195 367 Z" fill="url(#streamGrad)" />
    
    <!-- Stylized Modern 'X' Slash / Cinema Film Strip Ribbon -->
    <path d="M 335 155 L 368 185 L 205 375 L 172 345 Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M 235 175 L 340 340 L 305 365 L 200 200 Z" fill="url(#goldAccent)" fill-opacity="0.85" />
  </g>

  <!-- Ambient Flare -->
  <circle cx="210" cy="180" r="12" fill="#ffffff" fill-opacity="0.9" />
</svg>
