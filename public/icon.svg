<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Cyber Obsidian Gradient Background -->
    <radialGradient id="cyberBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0d111e" />
      <stop offset="50%" stop-color="#05070d" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Neon Cyan & Electric Magenta Gradient -->
    <linearGradient id="neonCyanPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#cyberBg)" />

  <!-- Outer Neon Border Glow -->
  <rect width="480" height="480" x="16" y="16" rx="106" fill="none" stroke="#00f3ff" stroke-opacity="0.3" stroke-width="2" />
  <rect width="472" height="472" x="20" y="20" rx="100" fill="none" stroke="url(#neonCyanPink)" stroke-width="3.5" filter="url(#softGlow)" />

  <!-- Neon Ambient Rays/Backdrop Glow -->
  <circle cx="256" cy="245" r="140" fill="#00f3ff" fill-opacity="0.08" filter="url(#neonGlow)" />
  <circle cx="320" cy="280" r="100" fill="#ff007f" fill-opacity="0.1" filter="url(#neonGlow)" />

  <!-- Center Emblem: Cyber Play Triangle & Neon 'X' Cinema Slash -->
  <g filter="url(#neonGlow)">
    <!-- Neon Play Triangle Base -->
    <path d="M 190 148 C 190 134 206 125 218 133 L 372 241 C 383 249 383 263 372 271 L 218 379 C 206 387 190 378 190 364 Z" 
          fill="none" 
          stroke="#00f3ff" 
          stroke-width="20" 
          stroke-linejoin="round" />

    <!-- Neon Play Core Fill -->
    <path d="M 205 170 C 205 160 216 154 225 160 L 345 244 C 353 250 353 260 345 266 L 225 350 C 216 356 205 350 205 340 Z" 
          fill="url(#neonCyanPink)" 
          fill-opacity="0.25" />

    <!-- Cyber Neon 'X' Slashing Accent in Hot Laser Pink -->
    <path d="M 335 150 L 370 185 L 180 375 L 145 340 Z" 
          fill="#ff007f" 
          filter="url(#neonGlow)" />

    <path d="M 335 150 L 370 185 L 180 375 L 145 340 Z" 
          fill="#ffffff" 
          fill-opacity="0.75" />

    <!-- Sharp Electric Highlight Lines -->
    <line x1="205" y1="165" x2="350" y2="255" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Glowing Accent Stars / Cyan Dots -->
  <circle cx="165" cy="155" r="7" fill="#00f3ff" filter="url(#softGlow)" />
  <circle cx="370" cy="355" r="6" fill="#ff007f" filter="url(#softGlow)" />
  <circle cx="340" cy="135" r="5" fill="#ffffff" filter="url(#softGlow)" />
</svg>
