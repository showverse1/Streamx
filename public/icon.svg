<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep jet black background gradient with subtle radial glow -->
    <radialGradient id="neonBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="60%" stop-color="#04060a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Electric Neon Cyan to Magenta Gradient -->
    <linearGradient id="neonCyanPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="neonAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="50%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Multi-stage Neon Glow Filters -->
    <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00f3ff" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#ff007f" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Pitch Black Body with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#neonBg)" />

  <!-- Cyber Neon Border with Dual-Color Glow -->
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#neonCyanPink)" stroke-width="4" stroke-opacity="0.85" filter="url(#intenseGlow)" />
  <rect width="476" height="476" x="18" y="18" rx="94" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="12 12" />

  <!-- Ambient Light Reflection Behind Logo -->
  <circle cx="256" cy="256" r="140" fill="#00f3ff" opacity="0.08" filter="blur(40px)" />
  <circle cx="256" cy="256" r="90" fill="#ff007f" opacity="0.1" filter="blur(30px)" />

  <!-- STREAMX Cyber 'X' Wings with Neon Gradient -->
  <g filter="url(#intenseGlow)">
    <!-- Left to Right Diagonal Arm -->
    <path d="M128 128 L196 128 L384 384 L316 384 Z" fill="url(#neonCyanPink)" />
    <!-- Right to Left Diagonal Arm -->
    <path d="M384 128 L316 128 L128 384 L196 384 Z" fill="url(#neonAccent)" opacity="0.92" />
  </g>

  <!-- Glowing Neon Play Arrow Core at the Center -->
  <g filter="url(#ultraGlow)">
    <!-- High-tech play triangle backdrop -->
    <polygon points="228,198 322,256 228,314" fill="#000000" stroke="#00f3ff" stroke-width="6" stroke-linejoin="round" />
    <!-- Solid bright play glyph -->
    <polygon points="234,208 310,256 234,304" fill="#ffffff" />
    <!-- Inner cyan accent reflection -->
    <polygon points="236,216 294,256 236,296" fill="#00f3ff" opacity="0.9" />
    <polygon points="238,226 278,256 238,286" fill="#ffffff" />
  </g>

  <!-- Cyber Dots / Corner Accents -->
  <circle cx="90" cy="90" r="4" fill="#00f3ff" filter="url(#intenseGlow)" />
  <circle cx="422" cy="90" r="4" fill="#ff007f" filter="url(#intenseGlow)" />
  <circle cx="90" cy="422" r="4" fill="#ff007f" filter="url(#intenseGlow)" />
  <circle cx="422" cy="422" r="4" fill="#00f3ff" filter="url(#intenseGlow)" />
</svg>
